name: Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 01:00 从官方插件目录刷新一次
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 刷新插件目录快照
        # 官方目录不可达时保留仓库内已提交的快照，不阻断部署
        run: node scripts/build-plugins.mjs || echo "::warning::插件目录刷新失败，沿用已提交的快照"

      - name: 组装站点
        run: |
          mkdir -p _site
          cp -r index.html assets plugins.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
